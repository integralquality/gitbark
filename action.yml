name: "gitbark"
description: "Fail CI when your git history exposes personal data — emails, real names, co-author leaks."
author: "gitbark"
branding:
  icon: "shield"
  color: "yellow"

inputs:
  path:
    description: "Directory to scan."
    required: false
    default: "."
  fail-on:
    description: "Severity that fails the job: high | medium | never."
    required: false
    default: "high"
  since:
    description: "Only scan commits after this ref (e.g. origin/main). Empty scans full history."
    required: false
    default: ""
  allow:
    description: "Emails or *@domain patterns to ignore, one per line or comma-separated."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        GITBARK_ALLOW: ${{ inputs.allow }}
      run: |
        node "${{ github.action_path }}/bin/gitbark.js" \
          --path "${{ inputs.path }}" \
          --fail-on "${{ inputs.fail-on }}" \
          ${{ inputs.since != '' && format('--since {0}', inputs.since) || '' }}
